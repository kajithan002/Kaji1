name: Build WaThemer APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android \
              -type f -name sdkmanager 2>/dev/null | head -1)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found SDK Manager: $SDKMANAGER"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export PATH="$(dirname "$SDKMANAGER"):$SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Extract source
        shell: bash
        run: |
          set -e

          ZIP="$GITHUB_WORKSPACE/wathemer-video-wallpaper-source-v2.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="$GITHUB_WORKSPACE/wathemer-video-wallpaper-source.zip"
          fi

          if [ ! -f "$ZIP" ]; then
            echo "Source ZIP missing!"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -q "$ZIP" -d source

          PROJECT="$GITHUB_WORKSPACE/source/wathemer-main"

          test -f "$PROJECT/gradlew"
          test -f "$PROJECT/app/build.gradle.kts"

          chmod +x "$PROJECT/gradlew"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wathemer-video-wallpaper-debug-apk
          path: source/wathemer-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
